# The tank packed as fishbowl.love with SHA256SUMS beside it
# (scripts/package.sh), checked by tests/ci.sh on Linux against the packed
# file itself rather than the checkout, and on a v* tag drafted as a
# release with both attached, for Easel to fetch (chrischaps/easel#35).
# Publishing by hand stays the gate, as in Terrarium. A tag with a hyphen
# (v0.1.0-frame.1) drafts a prerelease.
#
# The checks run on Linux: Windows runners have no OpenGL 2.1 for LÖVE's
# window, and the frame is Linux. xvfb's Mesa draws the shaders in software.
# The Windows job only wraps the .love those checks passed in an exe, for the
# download on chaps.dev (scripts/package-windows.ps1). It can't open a window
# there, so the zip gets tried by hand before the draft is published.
#
# SHA256SUMS stays about fishbowl.love alone, since it's Easel's to read.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fishbowl
          path: |
            dist/fishbowl.love
            dist/SHA256SUMS
          if-no-files-found: error

  check:
    needs: pack
    runs-on: ubuntu-latest
    env:
      ALSOFT_DRIVERS: "null" # OpenAL Soft's silent output; CI has no sound card
      GAME: dist/fishbowl.love
    steps:
      - uses: actions/checkout@v4 # for tests/

      - uses: actions/download-artifact@v4
        with:
          name: fishbowl
          path: dist

      - name: Check the download against SHA256SUMS
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Install LÖVE 11.5
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri
          cd "$RUNNER_TEMP"
          curl -fsSL -o love.AppImage https://github.com/love2d/love/releases/download/11.5/love-11.5-x86_64.AppImage
          chmod +x love.AppImage && ./love.AppImage --appimage-extract > /dev/null
          echo "LOVE=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"

      # on a screen the frame's size, so --frame fills 1280 x 720 as it will there
      - name: Check the packed tank
        run: xvfb-run -a -s "-screen 0 1280x720x24" sh tests/ci.sh

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4 # for the script, the icon and the readme

      - uses: actions/download-artifact@v4
        with:
          name: fishbowl
          path: dist

      - name: Wrap the checked tank in an exe
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME -replace '^v', '' } else { "dev" }
          ./scripts/package-windows.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: fishbowl-windows
          path: dist/fishbowl-*-windows-x64.zip
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fishbowl
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: fishbowl-windows
          path: dist

      - name: Draft the release (notes are written by hand before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist && sha256sum -c SHA256SUMS
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$TAG" fishbowl.love SHA256SUMS fishbowl-*-windows-x64.zip --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft $pre --title "Fishbowl ${TAG#v}" --notes "Draft: notes to follow."
